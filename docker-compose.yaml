version: "3.9"
networks:
  app_network:
    driver: bridge
services:
  domain:
    image: nginx:1.23.3
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./ssls:/ssls
      - ./nginx/default-domain.conf:/etc/nginx/conf.d/default-domain.conf
    networks:
      - app_network
volumes:
  mongo_data:
