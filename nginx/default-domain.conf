upstream api-staging-gbooking-production {
    server backend:8003;
}
server {
    listen       80;
    listen  [::]:80;
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name api.staging.gbooking.diennk.io.vn;
    ssl_certificate         /ssls/diennk_io_vn_crt.crt;
    ssl_certificate_key     /ssls/diennk_io_vn_pk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    location / {
        proxy_pass http://api-staging-gbooking-production;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
    }
}