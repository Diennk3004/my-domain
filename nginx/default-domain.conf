upstream api-staging-gbooking {
    server backend_env_staging_gbooking:8003;
}
server {
    listen       80;
    listen  [::]:80;
    server_name api.staging.gbooking.diennk.io.vn;    
    location / {
        proxy_pass http://api-staging-gbooking;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
    }
}