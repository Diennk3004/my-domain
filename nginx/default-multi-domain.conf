upstream admin_bashboard {
    server my_merchant_env_production_admin_dashboard:80;
}
upstream backend {
    server my_merchant_env_production_backend:8383;
}
server { 
    listen       80;
    listen  [::]:80;
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name diennk.io.vn;
    ssl_certificate         /ssls/diennk_io_vn_crt.crt;
    ssl_certificate_key     /ssls/diennk_io_vn_pk.key;    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    location / {  
        proxy_pass http://admin_bashboard;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;                         
    }
}
server { 
    listen       80;
    listen  [::]:80;
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name api.diennk.io.vn;
    ssl_certificate         /ssls/diennk-io-vn/cert.pem;
    ssl_certificate_key     /ssls/diennk-io-vn/key.pem;    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    location / {  
        proxy_pass http://backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;                         
    }
}  